# Folder with statements. Subfolders are scanned too (e.g. data\rbc\Visa\*.pdf).
# A subfolder name under rbc\ is used as the account name.
statements_dir: 'G:\My Drive\Personal Documents\Budgets\data'

# Local merged table (also a backup of everything sent to Google)
output_csv: transactions.csv

google:
  # Paste the full URL of the target spreadsheet (e.g. budget_planning)
  spreadsheet_url: "https://docs.google.com/spreadsheets/d/1tUkuWXBDMa-6Ohdj4XxzVCldwsHOphkVxgVWW_CNtic/edit?usp=sharing"
  # Service-account key downloaded from Google Cloud (see README)
  service_account_file: secrets/service_account.json
  worksheet: Transactions

ai:
  enabled: true # needs ANTHROPIC_API_KEY set in your environment
  model: claude-opus-5-5 # claude-haiku-5-5 is ~40x cheaper and fine for this job
  effort: low
  batch_size: 60
